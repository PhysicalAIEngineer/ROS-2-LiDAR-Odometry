name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ros2-test:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y             python3-pip             python3-pytest             python3-pytest-cov             python3-numpy             python3-scipy             python3-yaml             python3-colcon-common-extensions

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Build ROS 2 package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install

      - name: Run unit tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          pytest -q --disable-warnings --maxfail=1

      - name: Coverage
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          pytest --cov=simple_lidar_odometry             --cov-report=term-missing             --cov-fail-under=70
