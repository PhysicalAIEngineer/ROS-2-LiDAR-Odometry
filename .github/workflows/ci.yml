name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall simple_lidar_odometry test
      - name: Test
        run: pytest -q --disable-warnings --maxfail=1
      - name: Coverage
        run: pytest --cov=simple_lidar_odometry --cov-report=term-missing --cov-fail-under=70
